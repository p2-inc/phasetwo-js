# On each merge to main, publish the next version of @p2-inc/js-sdk to npm: a minor
# bump if the merged PR is labelled semver:minor (phasetwo-sdk-generator sets it for
# breaking spec changes), otherwise a patch bump of the version currently on npm. The
# version is set at publish time and the release is tagged vX.Y.Z; package.json's
# version in git isn't updated. Skip with [ci skip] in the commit message.
#
# Uses npm trusted publishing (OIDC): configure it on npmjs.com for this repo and
# workflow file. No NPM_TOKEN needed.
name: release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: read

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Choose version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(npm view "$(node -p 'require("./package.json").name')" version 2>/dev/null || echo 0.0.0)
          IFS=. read -r major minor patch <<< "$current"
          labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].labels[].name' 2>/dev/null || true)
          if grep -qx 'semver:minor' <<< "$labels"; then
            next="$major.$((minor + 1)).0"
          else
            next="$major.$minor.$((patch + 1))"
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
      - run: npm ci --no-audit --no-fund
      - run: npm version "${{ steps.version.outputs.next }}" --no-git-tag-version
      - run: npm run build
      - run: npm publish --provenance --access public
      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: v${{ steps.version.outputs.next }}
        run: |
          git tag "$NEXT" "$GITHUB_SHA"
          git push origin "$NEXT"
          gh release create "$NEXT" --generate-notes --verify-tag
