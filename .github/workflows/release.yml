# On each merge to main, publish the next version of @p2-inc/js-sdk to npm.
# Versions follow the API version in sdk-generator.json (the spec's info.version),
# shared by all Phase Two SDKs: the first release for API X.Y is X.Y.0, and later
# releases (e.g. SDK-only fixes) are X.Y.1, X.Y.2, ... based on this repo's tags.
# The version is set at publish time and tagged vX.Y.Z; package.json's version in
# git isn't updated. Skip with [ci skip] in the commit message.
#
# Uses npm trusted publishing (OIDC): configure it on npmjs.com for this repo and
# workflow file. No NPM_TOKEN needed.
name: release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Choose version
        id: version
        run: |
          api=$(sed -n 's/.*"apiVersion": *"\([^"]*\)".*/\1/p' sdk-generator.json)
          [ -n "$api" ] || { echo "::error::no apiVersion in sdk-generator.json"; exit 1; }
          mm=${api%.*}
          last=$(git tag --list "v$mm.*" --sort=-v:refname | head -1)
          if [ -z "$last" ]; then next="$mm.0"; else next="$mm.$(( ${last##*.} + 1 ))"; fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
      - run: npm ci --no-audit --no-fund
      - run: npm version "${{ steps.version.outputs.next }}" --no-git-tag-version
      - run: npm run build
      - run: npm publish --provenance --access public
      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: v${{ steps.version.outputs.next }}
        run: |
          git tag "$NEXT" "$GITHUB_SHA"
          git push origin "$NEXT"
          gh release create "$NEXT" --generate-notes --verify-tag
